[package]
name = "farm3d"
version = "0.1.0"
description = "An app for 3D print farm management"
authors = ["jeff-roche"]
edition = "2021"
autobins = false
# Required once a second binary (gen-catalog) exists alongside the app
# binary: Tauri's dev/build tooling invokes a bare `cargo run` with no
# `--bin`, which is otherwise ambiguous and fails outright.
default-run = "farm3d"

[features]
default = []
catalog-generator = []

[[bin]]
name = "farm3d"
path = "src/main.rs"

[[bin]]
name = "gen-catalog"
path = "src/bin/gen-catalog.rs"
required-features = ["catalog-generator"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "farm3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
ts-rs = "12"
tokio = { version = "1.53", features = ["sync", "time", "rt", "macros"] }
tokio-tungstenite = "0.30"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = "4.1"
mdns-sd = "0.21"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27"
