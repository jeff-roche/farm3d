[package]
name = "farm3d"
version = "0.1.0"
description = "An app for 3D print farm management"
authors = ["jeff-roche"]
edition = "2021"
autobins = false
# Required once a second binary (gen-catalog) exists alongside the app
# binary: Tauri's dev/build tooling invokes a bare `cargo run` with no
# `--bin`, which is otherwise ambiguous and fails outright.
default-run = "farm3d"

[features]
default = []
catalog-generator = []
# Builds `fake-orca`, the OrcaSlicer CLI double the slicing tests drive
# (spec D23). Never enabled for packaging; `scripts/assert-package-contents.sh`
# fails if the binary shows up in a bundle.
test-support = []

[[bin]]
name = "farm3d"
path = "src/main.rs"

[[bin]]
name = "gen-catalog"
path = "src/bin/gen-catalog.rs"
required-features = ["catalog-generator"]

[[bin]]
name = "fake-orca"
path = "src/bin/fake-orca.rs"
required-features = ["test-support"]

# Drives the `fake-orca` binary, so it needs the feature that builds it.
[[test]]
name = "p5_process"
path = "tests/p5_process.rs"
required-features = ["test-support"]

# Publishes what `fake-orca` slices.
[[test]]
name = "p5_publish"
path = "tests/p5_publish.rs"
required-features = ["test-support"]

[[test]]
name = "p5_slicing"
path = "tests/p5_slicing.rs"
required-features = ["test-support"]

[[test]]
name = "p5_tracer"
path = "tests/p5_tracer.rs"
required-features = ["test-support"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "farm3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
ts-rs = "12"
tokio = { version = "1.53", features = ["sync", "time", "rt", "macros", "test-util"] }
tokio-tungstenite = "0.30"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = "4.1"
mdns-sd = "0.21"
# OctoPrint's REST API and Moonraker's capability adapter. No default
# features: no TLS backend (matching tokio-tungstenite, so neither adapter
# speaks TLS yet), no system-proxy lookup, no HTTP/2. `multipart` and
# `stream` carry the streamed G-code upload (P6 D4); they add `mime_guess`
# and `unicase` to the lockfile. The rest was already there via Tauri.
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
notify = "8.2"
notify-debouncer-full = "0.7"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # D9: the Job Object that contains an OrcaSlicer process tree.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# ADR-0015: farm3d's own org.freedesktop.Notifications client. Pinned to
# the 5.19 line the lockfile already carries through `keyring`, with the
# same default features (the runtime-agnostic `async-io` backend, which
# runs fine alongside Tauri's tokio runtime). Enabling `tokio` here would
# switch keyring's zbus backend too, so don't.
#
# `notifications::activation` (and `examples/notify_spike.rs`) apply a
# Wayland activation token with `gtk::Window::set_startup_id`: the same gtk
# 0.18 the Tauri runtime already links.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "~5.19"
gtk = "0.18"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27"
