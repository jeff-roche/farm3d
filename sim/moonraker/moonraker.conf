# Moonraker config for the Moonraker simulator (sim/compose.yaml).
#
# Moonraker listens directly on 127.0.0.1:27126. Tests normally reach it
# through the fault-injection proxy on 27125 (sim/toxiproxy/toxiproxy.json);
# 27126 is the control path the harness uses to drive and reset the sim.
#
# moonraker-entrypoint.sh renders this file at every start, filling in
# trusted_clients below from /opt/printer_data/run/variant (`sim/simctl
# variant moonraker ...`): "default" and "no-bed" trust loopback; "apikey"
# trusts a documentation-only range (RFC 5737) that no client is ever
# really from, so every request needs the API key (`sim/simctl env`,
# `FARM3D_SIM_MOONRAKER_API_KEY`).
#
# `[webcam farm3d-sim]` (P8) names the static snapshot camera
# (sim/compose.yaml `camera`) through its fault-proxy port, 28080, as an
# absolute URL on this Connection's own host (127.0.0.1), so farm3d's
# host-webcam lookup and frame fetch have simulator evidence. Moonraker
# only lists it; it never fetches from it.

[server]
host: 127.0.0.1
port: 27126
klippy_uds_address: /opt/printer_data/run/klipper.sock

[machine]
provider: none
validate_service: False
validate_config: False

[authorization]
trusted_clients:
  @TRUSTED@
cors_domains:
  *

[history]

[webcam farm3d-sim]
service: mjpegstreamer-adaptive
stream_url: /webcam/?action=stream
snapshot_url: http://127.0.0.1:28080/snapshot.jpg
