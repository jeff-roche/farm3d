# Moonraker config for the multi-toolhead Moonraker simulator (sim/compose.yaml).
#
# Moonraker listens directly on 127.0.0.1:27136. Tests normally reach it
# through the fault-injection proxy on 27135 (sim/toxiproxy/toxiproxy.json);
# 27136 is the control path the harness uses to drive and reset the sim.
#
# moonraker-entrypoint.sh renders this file the same way it renders
# moonraker.conf, but nothing ever writes a variant marker for this
# service, so it always stays in "default" (trusted) mode. `sim/simctl
# variant` only supports the single-extruder `moonraker` simulator.

[server]
host: 127.0.0.1
port: 27136
klippy_uds_address: /opt/printer_data/run/klipper.sock

[machine]
provider: none
validate_service: False
validate_config: False

[authorization]
trusted_clients:
  @TRUSTED@
cors_domains:
  *

[history]
