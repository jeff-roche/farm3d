# The simulator camera (sim/compose.yaml `camera`, P8): a static snapshot
# camera serving the committed synthetic test pattern `snapshot.jpg`.
#
# It listens directly on 127.0.0.1:28081. farm3d reaches it through the
# fault proxy on 28080 (sim/toxiproxy/toxiproxy.json), which is the address
# the Moonraker simulator's `[webcam farm3d-sim]` names; 28081 is the
# harness's control path (readiness only).
#
# Every snapshot GET is logged to /tmp/farm3d-camera-access.log inside the
# container, one line per request (`sim/simctl camera-requests` counts
# them), so a test can prove farm3d fetched no frame without a trigger.
# The readiness check uses /healthz and is never counted.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/farm3d-camera-nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    log_format farm3d '$request_method $uri $status';
    server_tokens off;

    server {
        listen 127.0.0.1:28081;

        location = /snapshot.jpg {
            root /farm3d-sim;
            default_type image/jpeg;
            add_header Cache-Control "no-store" always;
            access_log /tmp/farm3d-camera-access.log farm3d;
        }

        location = /healthz {
            return 204;
        }

        location / {
            return 404;
        }
    }
}
