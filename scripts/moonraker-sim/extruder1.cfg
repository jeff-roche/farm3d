
# A second toolhead for the multi-tool simulator variant (sim.sh up ...
# multi-tool). It uses pins printer.cfg leaves free on the emulated
# atmega644p; the PA6 thermistor input is not driven either, so its reading
# is a fixed value like the others.
[extruder1]
step_pin: PC4
dir_pin: PC5
enable_pin: PA1
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA6
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 210
